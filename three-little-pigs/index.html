<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#cfe8f3">
  <title>3びきのこぶた</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <!-- 物語の舞台。どこをタッチしても操作になる -->
    <div class="stage" id="stage">
      <svg id="svg" class="world" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" aria-hidden="true">
        <defs id="defs"></defs>
        <g id="l-bg"></g>
        <g id="l-props"></g>
        <g id="l-actors"></g>
        <g id="l-front"></g>
        <g id="l-fx"></g>
        <g id="l-hint"></g>
      </svg>
    </div>

    <!-- 上のボタン（遊んでいるあいだ） -->
    <div class="topbar" id="topbar" hidden>
      <button type="button" class="icon-btn glass" id="btn-home" aria-label="おわる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h4.5v-6h4v6h4.5V10"/></svg>
      </button>
      <div class="topbar-right">
        <button type="button" class="icon-btn glass" id="btn-mic" aria-label="マイク">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/><path class="slash" d="M4 4l16 16"/></svg>
        </button>
        <button type="button" class="icon-btn glass" id="btn-sound" aria-label="おと">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="slash" d="M15 9l6 6M21 9l-6 6"/></svg>
        </button>
      </div>
    </div>

    <!-- 操作の目印（あと何回か・マイクの音量）。文字は出さない -->
    <div class="prompt glass" id="prompt" hidden>
      <div class="prompt-mic">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="17" y="5" width="14" height="24" rx="7"/><path d="M10 22a14 14 0 0 0 28 0M24 36v7M16 43h16"/></svg>
        <div class="meter" aria-hidden="true"><i id="meter-fill"></i></div>
      </div>
      <div class="dots" id="dots"></div>
    </div>

    <!-- せりふ（話しているキャラクターの上に出す吹き出し） -->
    <div class="bubble" id="bubble" hidden>
      <p class="bubble-line" id="bubble-line"></p>
    </div>

    <!-- 語り（地の文）。設定の「もじ」が ON のときだけ出す -->
    <div class="caption glass" id="caption" hidden>
      <p class="line" id="line"></p>
    </div>

    <!-- タイトル -->
    <section class="overlay title" id="title">
      <div class="title-card">
        <h1 class="logo"><span class="logo-num">3</span>びきの<span class="br"></span> こぶた</h1>
        <button type="button" class="play" id="btn-start" aria-label="はじめる">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 11 38 24 17 37z"/></svg>
        </button>
        <div class="opts">
          <button type="button" class="opt" id="opt-mic" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
            <span>いきで ふーっ</span>
          </button>
          <button type="button" class="opt" id="opt-voice" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10H11l-4.5 4v-4H4z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"/></svg>
            <span>よみあげ</span>
          </button>
          <button type="button" class="opt" id="opt-text" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11.5a2.5 2.5 0 0 1 2.5 2.5v12.5H7.5A2.5 2.5 0 0 1 5 17z"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H19M9 8.5h6M9 11.5h4"/></svg>
            <span>もじ</span>
          </button>
          <button type="button" class="opt" id="opt-sound" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
            <span>こうかおん</span>
          </button>
        </div>
        <label class="voice-pick glass" id="voice-pick" hidden>
          <span>こえ</span>
          <select id="voice-select" aria-label="よみあげの こえ"></select>
        </label>
        <div class="notes">
          <p class="note" id="mic-note"></p>
          <p class="note rotate-note">スマホは よこむきに すると、おおきく みえるよ</p>
          <p class="note credit">こえ：VOICEVOX:冥鳴ひまり</p>
        </div>
      </div>
    </section>

    <!-- おしまい -->
    <section class="overlay end" id="end" hidden>
      <div class="end-card glass">
        <p class="end-title">おしまい</p>
        <div class="end-buttons">
          <button type="button" class="play" id="btn-again" aria-label="もういっかい">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M36 24a12 12 0 1 1-4-9" fill="none"/><path d="M34 7v9h-9"/></svg>
          </button>
          <button type="button" class="sub-btn" id="btn-to-title">タイトルへ</button>
        </div>
      </div>
    </section>

    <!-- おわるか確認 -->
    <section class="overlay confirm" id="confirm" hidden>
      <div class="confirm-card">
        <p>おわりに する？</p>
        <div class="confirm-buttons">
          <button type="button" class="sub-btn" id="btn-quit">おわる</button>
          <button type="button" class="sub-btn primary" id="btn-continue">つづける</button>
        </div>
      </div>
    </section>

    <div class="fade" id="fade"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="js/story.js"></script>
  <script src="js/breath.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/voice-lines.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/mic.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
