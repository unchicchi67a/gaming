<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4dc">
  <meta name="description" content="おじいさん、おばあさん、まご、いぬ、ねこ、ねずみを呼んで、おおきなかぶを引っこぬき、届け先までぴったり飛ばすゲーム">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>おおきなかぶ とばし</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kiwi+Maru:wght@400;500&display=swap">
  <!-- ?v= は版の番号。GitHub Pages はファイルを 10 分ほどキャッシュするので、
       JS や CSS を変えたら番号を上げて、新しい HTML と古い JS が組み合わさらないようにする -->
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main class="app">
    <canvas id="stage" aria-label="かぶを引っぱるようす"></canvas>

    <!-- プレイ中の表示 -->
    <div class="hud" id="hud" hidden>
      <div class="hud-top">
        <div class="goal">
          <span class="goal-stage" id="goal-stage">ステージ 1</span>
          <span class="goal-place"><span class="goal-emoji" id="goal-emoji">🍲</span><span id="goal-name">台所のおなべ</span>まで</span>
          <span class="goal-dist" id="goal-dist">5 m</span>
          <span class="goal-range" id="goal-range">OK：2.5〜7.5 m</span>
        </div>
        <button class="btn btn-mini" id="quit" type="button" aria-label="ステージ選びにもどる">✕</button>
      </div>
      <div class="hud-bottom">
        <p class="story" id="story" aria-live="polite"></p>
        <div class="controls">
          <button class="btn btn-call" id="call" type="button"><span class="call-label" id="call-label">おばあさんを よぶ</span><span class="call-note">おしているあいだ あつまる</span></button>
          <button class="btn btn-pull" id="pull" type="button">うんとこしょ！</button>
        </div>
      </div>
    </div>

    <!-- タイトル：絵本の表紙 -->
    <section class="overlay" id="title-screen">
      <div class="column">
        <div class="cover">
          <p class="cover-kicker">むかしばなし アクション</p>
          <h1 class="logo"><span class="logo-small">おおきなかぶ</span><span class="logo-big"><span style="--i:0">と</span><span style="--i:1">ば</span><span style="--i:2">し</span></span></h1>
          <ul class="rules">
            <li>おじいさん → おばあさん → まご → いぬ → ねこ → ねずみ の順に、<strong>ボタンを長く押すほど</strong>おおぜい集まる</li>
            <li>力は<strong>みんなの力のかけ算</strong>。同じおばあさんでも、ガリガリからムキムキまでいろいろ</li>
            <li>ねずみが来るまでかぶはぬけない。<strong>かぶの動き方</strong>で、あとどれくらいかを読もう</li>
            <li>ぬけたかぶを、<strong>届け先までぴったり</strong>飛ばしたらクリア</li>
          </ul>
        </div>
        <div class="stage-head">
          <h2 class="stage-title">ステージをえらぶ</h2>
          <button class="btn btn-random" id="random" type="button">🎲 ランダム</button>
        </div>
        <div class="stage-grid" id="stage-grid"></div>
        <a class="back-link" href="../">← ゲーム一覧</a>
      </div>
    </section>

    <!-- 結果 -->
    <section class="overlay overlay-dim" id="result-screen" hidden>
      <div class="column result-column">
        <div class="page result-page">
          <div class="stamp" id="result-stamp" aria-hidden="true"></div>
          <h2 class="result-title" id="result-title"></h2>
          <p class="result-text" id="result-text"></p>
          <dl class="stats" id="result-stats"></dl>
        </div>
        <div class="result-buttons">
          <button class="btn btn-main" id="next" type="button">つぎのステージ</button>
          <button class="btn btn-sub" id="retry" type="button">もういちど</button>
          <button class="btn btn-sub" id="to-title" type="button">ステージをえらぶ</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/game.js?v=1"></script>
  <script src="js/fullscreen.js?v=1"></script>
  <script src="js/main.js?v=1"></script>
</body>
</html>
