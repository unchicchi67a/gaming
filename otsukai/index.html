<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#8fd3f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="お母さんのメモを見て、町のお店で品物を買ってくる、3歳くらい向けのおつかいゲーム">
  <title>おつかい できるかな？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" data-shop="">
    <!-- 空と町（どの場面でも奥に見える） -->
    <div class="sky" aria-hidden="true">
      <div class="cloud cloud--a"></div>
      <div class="cloud cloud--b"></div>
      <div class="cloud cloud--c"></div>
    </div>

    <!-- タイトル -->
    <section class="scene title" id="title">
      <div class="town" id="title-town" aria-hidden="true"></div>
      <h1 class="logo" id="logo" aria-label="おつかい できるかな？"></h1>
      <div class="title-stage">
        <div class="title-house" id="title-house" aria-hidden="true"></div>
        <div class="mom mom--title" id="title-mom" aria-hidden="true"></div>
      </div>
      <button type="button" class="big-btn big-btn--go" id="btn-start">はじめる</button>
      <button type="button" class="parent-btn" id="btn-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg>
        <span>おうちの方へ</span>
      </button>
    </section>

    <!-- おうち：お母さんがメモをわたす／帰ってきたら、よろこぶ -->
    <section class="scene home" id="home" hidden>
      <div class="room" aria-hidden="true">
        <div class="room-window"></div>
        <div class="room-floor"></div>
      </div>
      <div class="home-stage">
        <div class="mom" id="home-mom"></div>
        <div class="talk" id="home-talk">
          <p class="talk-text" id="home-text"></p>
          <div class="memo-card memo-card--talk" id="home-memo"></div>
        </div>
      </div>
      <button type="button" class="big-btn big-btn--go" id="btn-go">いってきます！</button>
    </section>

    <!-- 町の地図：おうちとお店がならぶ -->
    <section class="scene map" id="map" hidden>
      <div class="town town--map" id="map-town" aria-hidden="true"></div>
      <div class="road" aria-hidden="true"></div>
      <div class="places" id="places"></div>
    </section>

    <!-- お店の中 -->
    <section class="scene shop" id="shop" hidden>
      <div class="awning" aria-hidden="true"><div class="awning-scallop"></div></div>
      <div class="sign" aria-hidden="true"><span id="shop-name"></span></div>
      <div class="shelf-wrap">
        <div class="shelf" id="shelf" aria-label="おみせの しなもの"></div>
      </div>
      <div class="basket-wrap">
        <div class="basket" id="basket">
          <div class="basket-art" id="basket-art" aria-hidden="true"></div>
          <div class="basket-items" id="basket-items"></div>
        </div>
      </div>
      <button type="button" class="toy-btn toy-btn--back" id="btn-back" aria-label="まちに もどる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <div class="count-pop" id="count-pop" hidden></div>
    </section>

    <!-- どの場面でも出るボタン -->
    <div class="hud" id="hud" hidden>
      <button type="button" class="toy-btn" id="btn-quit" aria-label="おわる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
      <button type="button" class="memo-btn" id="btn-memo" aria-label="メモを みる">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 6h22l8 8v28H10z" fill="#fffdf7"/>
          <path d="M32 6v8h8" fill="#f3e6d3"/>
          <path d="M16 20h18M16 27h18M16 34h12" stroke="#d8c3ae" stroke-width="3" stroke-linecap="round"/>
          <path d="M10 6h22l8 8v28H10zM32 6v8h8" fill="none"/>
        </svg>
        <span>メモ</span>
      </button>
      <button type="button" class="toy-btn" id="btn-sound" aria-label="おと">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="slash" d="M15 9l6 6M21 9l-6 6"/></svg>
      </button>
    </div>

    <!-- 演出（品物が飛ぶ・紙ふぶき） -->
    <div class="fx" id="fx" aria-hidden="true"></div>

    <!-- メモ（いつでも見られる） -->
    <section class="overlay memo" id="memo" hidden>
      <div class="memo-sheet" role="dialog" aria-modal="true" aria-label="おかあさんの メモ">
        <p class="memo-title">おかあさんの メモ</p>
        <div class="memo-card" id="memo-card"></div>
        <button type="button" class="big-btn" id="btn-memo-close">とじる</button>
      </div>
    </section>

    <!-- おうちの方向けの設定 -->
    <section class="overlay settings" id="settings" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 class="panel-title" id="settings-title">設定</h2>
        <div class="setting setting--stack">
          <div class="setting-text">
            <p class="setting-name">レベル</p>
            <p class="setting-note" id="level-note"></p>
          </div>
          <div class="seg" id="opt-level"></div>
        </div>
        <div class="setting">
          <div class="setting-text"><p class="setting-name">効果音</p></div>
          <button type="button" class="switch" id="opt-sound" role="switch" aria-checked="true" aria-label="効果音"><i></i></button>
        </div>
        <div class="setting">
          <div class="setting-text"><p class="setting-name">音楽</p></div>
          <button type="button" class="switch" id="opt-music" role="switch" aria-checked="true" aria-label="音楽"><i></i></button>
        </div>
        <button type="button" class="big-btn" id="btn-settings-close">とじる</button>
      </div>
    </section>

    <!-- おしまい -->
    <section class="overlay end" id="end" hidden>
      <div class="end-card">
        <p class="end-title">できたね！</p>
        <div class="end-buttons">
          <button type="button" class="round-btn" id="btn-again" aria-label="もういっかい">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M35 24a11 11 0 1 1-3.6-8.2" fill="none"/><path d="M33 8v9h-9"/></svg>
          </button>
          <button type="button" class="round-btn round-btn--home" id="btn-to-title" aria-label="タイトルに もどる">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 23 24 10l16 13M13 20v17h8v-9h6v9h8V20" fill="none"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- おわるか確認 -->
    <section class="overlay confirm" id="confirm" hidden>
      <div class="end-card">
        <p class="end-title end-title--small">おわりに する？</p>
        <div class="end-buttons">
          <button type="button" class="big-btn big-btn--quiet" id="btn-quit-yes">おわる</button>
          <button type="button" class="big-btn" id="btn-quit-no">つづける</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 品物とお店のデータ・絵は「おみせやさんごっこ」のものを使う -->
  <script src="../omiseyasan/js/items.js"></script>
  <script src="../omiseyasan/js/art.js"></script>
  <script src="js/errand.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fullscreen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
